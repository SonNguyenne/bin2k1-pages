<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Đang chuyển hướng · Bin 2k1</title>
<style>
:root{--bg:#141413;--fg:#f2efe6;--ac:#c8f03c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.65 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:48px 20px 64px}
h1{font-size:2rem;margin:0 0 .4em;color:var(--ac);line-height:1.2}
h2{font-size:1.2rem;margin:2em 0 .4em;color:var(--ac)}
a{color:var(--ac)}
.muted{opacity:.7;font-size:.9rem}
nav{margin-top:2.5em;display:flex;gap:18px;flex-wrap:wrap}
code,.box{background:#23231f;border-radius:6px;padding:2px 6px;word-break:break-all}
.box{display:block;padding:12px;margin:12px 0}
.btn{display:inline-block;background:var(--ac);color:var(--bg);padding:10px 18px;border-radius:8px;text-decoration:none;font-weight:700}
</style>
</head>
<body>
<main>
<h1>Đang kết nối với Bin 2k1…</h1>
<p>Trang này chuyển bạn về ứng dụng đang chạy trên máy của bạn. Phải mở trang này trên chính máy đó.</p>
<p><a id="go" class="btn" href="#">Bấm vào đây nếu không tự chuyển</a></p>
<noscript><p>Trình duyệt đang tắt JavaScript. Hãy dán thủ công phần sau dấu <code>?</code> của địa chỉ trang này vào cuối <code>http://localhost:8790/oauth/tiktok/callback?</code></p></noscript>
<script>
(function () {
  var target = "http://localhost:8790/oauth/tiktok/callback" + location.search;
  document.getElementById("go").href = target;
  if (location.search) { location.replace(target); }
})();
</script>
<nav><a href="index.html">Trang chủ</a><a href="privacy.html">Quyền riêng tư</a><a href="terms.html">Điều khoản</a></nav>
</main>
</body>
</html>
